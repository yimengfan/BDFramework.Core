name: Docs (github.io)

# 构建并发布 BDFramework 文档站点到 GitHub Pages。
#
# 触发条件：
#   - `docs/**`、`mkdocs.yml`、`requirements-docs.txt` 或本 workflow 变更时（push 到主分支）
#   - 手动触发（workflow_dispatch），可选是否发布
#
# 发布方式：官方 Pages Actions（upload-pages-artifact + deploy-pages），
# 不使用 `mkdocs gh-deploy`，避免向 gh-pages 分支写入构建产物。

on:
  push:
    branches:
      - master
      - v4/v-4.0.0
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建后是否发布到 GitHub Pages'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，且不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: 安装文档依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: 构建（严格模式）
        # --strict 会把断链、缺失 nav 目标等 warning 升级为错误，
        # 保证发布出去的站点不会出现死链。
        run: mkdocs build --strict

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时把仓库的 Pages 源从 "Deploy from a branch"（master / 根目录，
          # 由 Jekyll 渲染 README）自动切换为 "GitHub Actions"。
          # 不设置此项时 actions/deploy-pages 会因为 build_type 仍是 legacy 而失败。
          # 需要 `pages: write` + `id-token: write`（见文件顶部的 permissions）。
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      # 一次性仓库设置：`github-pages` 环境的 deployment_branch_policy 默认为 null，
      # 此时 GitHub 只允许**默认分支**（master）发起 Pages 部署。
      # 本仓库文档在 v4/v-4.0.0 上维护，因此首次运行必然以如下错误失败：
      #   Invalid deployment branch and no branch protection rules set in the
      #   environment. Deployments are only allowed from master
      # 该策略只能由仓库管理员修改，GITHUB_TOKEN 无权限，故此处给出可操作提示。
      - name: 部署失败时给出配置指引
        if: failure()
        run: |
          echo "::error title=需要一次性仓库设置::允许 v4/v-4.0.0 发布到 github-pages 环境"
          cat <<'HINT'
          部署被 GitHub 拒绝，原因是 `github-pages` 环境的部署分支策略不允许当前分支。

          由仓库管理员二选一完成一次性设置：

          【UI】Settings → Environments → github-pages
                → Deployment branches and tags
                → 选 "All branches"，或 Add deployment branch rule 添加 `v4/v-4.0.0`

          【API】需要 admin 权限的 PAT：
                # 1) 打开自定义分支策略
                curl -X PUT \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/yimengfan/BDFramework.Core/environments/github-pages \
                  -d '{"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}'

                # 2) 允许 v4/v-4.0.0
                curl -X POST \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/yimengfan/BDFramework.Core/environments/github-pages/deployment-branch-policies \
                  -d '{"name":"v4/v-4.0.0","type":"branch"}'

          设置完成后重新运行本 workflow（Actions → Docs (github.io) → Re-run jobs）即可发布。
          HINT
