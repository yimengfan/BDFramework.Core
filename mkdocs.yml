      - 管理器体系 ManagerBase: api/manager-base.md
      - 资源加载 BResources: api/resources.md
      - 表格 SQLite: api/sqlite.md
      - 事件总线 EventBus: api/event-bus.md
      - 配置中心 GameConfig: api/game-config.md
      - 屏幕导航 ScreenView: api/screen-navigation.md
